<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻卡日记 - 极速版</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
  </head>
  <body>
    <section class="auth-screen" id="authScreen">
      <div class="auth-card">
        <p class="eyebrow">轻卡日记</p>
        <h1>欢迎回来</h1>
        <p>输入账号和密码即可开始同步。第一次使用请直接点击注册。</p>
        <form id="authForm" class="auth-form">
          <input id="authEmail" type="text" placeholder="账号 (建议用字母或数字)" autocomplete="username" required />
          <input id="authPassword" type="password" placeholder="密码 (至少 6 位)" autocomplete="current-password" required />
          <button id="loginButton" type="submit">立即登录</button>
          <button id="signupButton" class="ghost-button" type="button">注册新账号</button>
        </form>
        <div class="cloud-status" id="authStatus">等待操作...</div>
      </div>
    </section>

    <main class="app locked" id="appRoot">
      <section class="topbar">
        <div>
          <p class="eyebrow">轻卡日记</p>
          <h1>每天记录一点点，健康生活每一天</h1>
        </div>
        <div class="top-controls">
          <label class="theme-picker">
            主题 <select id="themeSelect" aria-label="切换主题"></select>
          </label>
          <div class="date-picker">
            <button class="icon-button" id="prevDay">‹</button>
            <input type="date" id="activeDate" />
            <button class="icon-button" id="nextDay">›</button>
          </div>
        </div>
      </section>

      <section class="summary-grid">
        <article class="summary-card">
          <span>今日摄入</span>
          <strong id="totalCalories">0</strong><small>千卡</small>
          <div class="meter"><i id="calorieMeter"></i></div>
          <p id="calorieHint">请先设置每日目标</p>
        </article>
        <article class="summary-card">
          <span>剩余配额</span>
          <strong id="remainingCalories">0</strong><small>千卡</small>
          <p>基于目标与运动计算</p>
        </article>
        <article class="summary-card">
          <span>运动消耗</span>
          <strong id="burnedCalories">0</strong><small>千卡</small>
          <p>建议每天运动 30 分钟</p>
        </article>
        <article class="summary-card">
          <span>当前体重</span>
          <strong id="currentWeightText">--</strong><small>kg</small>
          <p id="weightHint">记录体重以查看趋势</p>
        </article>
      </section>

      <section class="workspace">
        <div class="panel tracker">
          <div class="panel-head">
            <h2>今日饮食记录</h2>
            <button class="ghost-button" id="copyYesterday">复制昨天</button>
          </div>
          
          <div class="weight-row">
            <label>体重 kg <input type="number" id="dailyWeight" step="0.1" /></label>
            <label>饮水 (杯) <input type="number" id="waterCups" step="1" /></label>
            <label>睡眠 (h) <input type="number" id="sleepHours" step="0.5" /></label>
          </div>

          <form class="entry-form" id="entryForm">
            <select id="mealType">
              <option value="breakfast">早餐</option>
              <option value="lunch">午餐</option>
              <option value="dinner">晚餐</option>
              <option value="snack">加餐</option>
            </select>
            <input id="foodName" type="text" placeholder="食物名称" />
            <input id="foodCalories" type="number" placeholder="热量" required />
            <button id="entrySubmit" type="submit">添加</button>
            <button id="entryCancel" class="ghost-button hidden" type="button">取消</button>
          </form>

          <div class="meal-list" id="mealList"></div>
        </div>

        <aside class="panel goals">
          <div class="panel-head compact">
            <h2>个人设置</h2>
            <div class="small-actions">
              <button class="ghost-button" id="logoutButton">退出登录</button>
            </div>
          </div>
          <div class="cloud-status" id="cloudStatus">未连接</div>
          <label>目标体重 kg <input type="number" id="targetWeight" step="0.1" /></label>
          <label>每日热量目标 <input type="number" id="dailyGoal" /></label>
          <label>今日运动消耗 <input type="number" id="exerciseCalories" /></label>
          <div class="goal-result">
            <strong id="goalProgress">--</strong>
            <span id="goalDetail">--</span>
          </div>
        </aside>
      </section>

      <section class="panel calendar-panel">
        <div class="panel-head">
          <div>
            <h2>健康日历</h2>
            <p>每天的体重、三餐和加餐一眼能看到。</p>
          </div>
          <div class="month-nav">
            <button class="icon-button" id="prevMonth" type="button">‹</button>
            <button class="icon-button" id="nextMonth" type="button">›</button>
          </div>
        </div>
        <div class="weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="calendar" id="calendar"></div>
      </section>

      <section class="insights">
        <article class="panel">
          <h2>最近 7 天</h2>
          <div class="bars" id="trendBars"></div>
        </article>
        <article class="panel">
          <h2>贴心提醒</h2>
          <ul id="tips"></ul>
        </article>
      </section>
    </main>

    <template id="mealTemplate">
      <section class="meal-card">
        <div class="meal-title"><h3></h3><span></span></div>
        <div class="entries"></div>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>

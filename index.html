<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻卡日记 - 最终修复版</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
      /* 强制修复布局补丁 */
      #authScreen {
        position: fixed !important;
        top: 0 !important; left: 0 !important;
        width: 100vw !important; height: 100vh !important;
        background: #f4f7f6 !important; /* 纯色背景防止穿透 */
        z-index: 10000 !important;
        display: flex !important; align-items: center; justify-content: center;
      }
      #authScreen.hidden { display: none !important; }
      
      /* 没登录时彻底移除主内容，防止 JS 渲染冲突 */
      body.not-logged-in #appRoot { display: none !important; }
      
      /* 主题下拉框容器修复 */
      .theme-picker { position: relative; z-index: 100; }
      select { cursor: pointer; }
    </style>
  </head>
  <body class="not-logged-in">
    <section id="authScreen">
      <div class="auth-card" style="background:white; padding:30px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.1); width:320px;">
        <p style="color:#2f8a60; font-weight:bold; margin-bottom:5px;">轻卡日记</p>
        <h2 style="margin-top:0;">欢迎回来</h2>
        <form id="authForm">
          <input id="authEmail" type="text" placeholder="账号" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;" />
          <input id="authPassword" type="password" placeholder="密码" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;" />
          <button id="loginButton" type="submit" style="width:100%; padding:12px; background:#2f8a60; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">立即登录</button>
          <button id="signupButton" type="button" style="width:100%; background:none; border:none; color:#666; margin-top:10px; cursor:pointer;">注册新账号</button>
        </form>
        <p id="authStatus" style="font-size:12px; text-align:center; color:#888; margin-top:15px;">等待连接云端...</p>
      </div>
    </section>

    <main id="appRoot">
      <section class="topbar">
        <div>
          <p class="eyebrow">轻卡日记</p>
          <h1>健康生活，从记录开始</h1>
        </div>
        <div class="top-controls">
          <label class="theme-picker">主题 <select id="themeSelect"></select></label>
          <div class="date-picker">
            <button id="prevDay" class="icon-button">‹</button>
            <input type="date" id="activeDate" />
            <button id="nextDay" class="icon-button">›</button>
          </div>
        </div>
      </section>

      <section class="summary-grid">
        <article class="summary-card"><span>今日摄入</span><strong id="totalCalories">0</strong><small>kcal</small></article>
        <article class="summary-card"><span>还可以吃</span><strong id="remainingCalories">0</strong><small>kcal</small></article>
        <article class="summary-card"><span>运动消耗</span><strong id="burnedCalories">0</strong><small>kcal</small></article>
        <article class="summary-card"><span>当前体重</span><strong id="currentWeightText">--</strong><small>kg</small></article>
      </section>

      <section class="workspace">
        <div class="panel tracker">
          <div class="panel-head"><h2>饮食记录</h2><button id="copyYesterday" class="ghost-button">复制昨天</button></div>
          <form id="entryForm" class="entry-form">
            <select id="mealType">
                <option value="breakfast">早餐</option><option value="lunch">午餐</option>
                <option value="dinner">晚餐</option><option value="snack">加餐</option>
            </select>
            <input id="foodName" type="text" placeholder="食物名称" />
            <input id="foodCalories" type="number" placeholder="热量" required />
            <button type="submit">添加</button>
          </form>
          <div id="mealList" class="meal-list"></div>
        </div>
        <aside class="panel goals">
          <h2>云端同步</h2>
          <div id="cloudStatus" class="cloud-status">未连接</div>
          <label>每日热量目标 <input type="number" id="dailyGoal" /></label>
          <button id="logoutButton" class="ghost-button" style="width:100%; color:red; margin-top:20px;">退出登录</button>
        </aside>
      </section>
    </main>

    <template id="mealTemplate">
      <div class="meal-card"><div class="meal-title"><h3></h3><span></span></div><div class="entries"></div></div>
    </template>
    <script src="app.js"></script>
  </body>
</html>

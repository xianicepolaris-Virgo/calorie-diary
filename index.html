<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>轻卡日记 - 极速修复版</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
      /* 强制修复遮挡问题的补丁样式 */
      .auth-screen {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: var(--bg-color, #f5f5f7);
        z-index: 9999; /* 确保在最顶层 */
        display: flex; align-items: center; justify-content: center;
      }
      .auth-screen.hidden { display: none !important; }
      .app.locked { display: none; } /* 没登录时完全不渲染主界面，防止遮挡 */
      .topbar { z-index: 10; position: relative; }
    </style>
  </head>
  <body>
    <section class="auth-screen" id="authScreen">
      <div class="auth-card">
        <p class="eyebrow">极速登录</p>
        <h1 style="margin: 10px 0;">欢迎回来</h1>
        <form id="authForm" class="auth-form">
          <input id="authEmail" type="text" placeholder="账号" required style="width:100%; margin-bottom:10px; padding:12px; border-radius:8px; border:1px solid #ddd;" />
          <input id="authPassword" type="password" placeholder="密码" required style="width:100%; margin-bottom:10px; padding:12px; border-radius:8px; border:1px solid #ddd;" />
          <button id="loginButton" type="submit" style="width:100%; padding:12px; background:#007aff; color:white; border:none; border-radius:8px; cursor:pointer;">立即登录</button>
          <button id="signupButton" class="ghost-button" type="button" style="width:100%; margin-top:10px; background:none; border:none; color:#666;">没有账号？直接注册</button>
        </form>
        <div id="authStatus" style="margin-top:15px; font-size:14px; text-align:center;">正在检查连接...</div>
      </div>
    </section>

    <main class="app locked" id="appRoot">
      <section class="topbar">
        <div>
          <p class="eyebrow">轻卡日记</p>
          <h1>健康生活记录</h1>
        </div>
        <div class="top-controls">
          <label class="theme-picker">
            主题 <select id="themeSelect"></select>
          </label>
          <div class="date-picker">
            <button class="icon-button" id="prevDay">‹</button>
            <input type="date" id="activeDate" />
            <button class="icon-button" id="nextDay">›</button>
          </div>
        </div>
      </section>

      <section class="summary-grid">
        <article class="summary-card">
          <span>今日摄入</span>
          <strong id="totalCalories">0</strong><small>kcal</small>
        </article>
        <article class="summary-card">
          <span>运动消耗</span>
          <strong id="burnedCalories">0</strong><small>kcal</small>
        </article>
        <article class="summary-card">
          <span>当前体重</span>
          <strong id="currentWeightText">--</strong><small>kg</small>
        </article>
      </section>

      <section class="workspace">
        <div class="panel tracker">
          <div class="panel-head">
            <h2>饮食记录</h2>
            <button class="ghost-button" id="copyYesterday">复制昨天</button>
          </div>
          <form class="entry-form" id="entryForm">
            <select id="mealType">
              <option value="breakfast">早餐</option>
              <option value="lunch">午餐</option>
              <option value="dinner">晚餐</option>
              <option value="snack">加餐</option>
            </select>
            <input id="foodName" type="text" placeholder="食物" />
            <input id="foodCalories" type="number" placeholder="热量" required />
            <button id="entrySubmit" type="submit">添加</button>
          </form>
          <div class="meal-list" id="mealList"></div>
        </div>

        <aside class="panel goals">
          <h2>个人目标</h2>
          <div class="cloud-status" id="cloudStatus">未连接</div>
          <label>每日目标 <input type="number" id="dailyGoal" /></label>
          <label>今日运动 <input type="number" id="exerciseCalories" /></label>
          <button id="logoutButton" class="ghost-button" style="margin-top:20px; color:red;">退出登录</button>
        </aside>
      </section>
    </main>

    <template id="mealTemplate">
      <section class="meal-card">
        <div class="meal-title"><h3></h3></div>
        <div class="entries"></div>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
